# H.E.R.M.E.S fleet roster — the source of truth for the bot fleet.
#
# Every entry is one Hermes Agent profile ("bot"). The profile description is
# what the kanban decomposer reads when it routes a task to a specialist, so
# keep it role-focused. Models are FREE tiers only:
#   - openrouter  : OpenRouter models tagged ":free" (OpenRouter free tier)
#   - gemini      : Google AI Studio free tier (GOOGLE_API_KEY)
#   - ollama-launch: local Ollama fallback (no quota, no cost)
#
# Toolsets ship a COMMON BASE (full computer access as the normal user) plus
# per-role extras. `computer_use` is the cua-driver GUI automation backend
# (screen, mouse, keyboard, UIAutomation) — verified healthy on Windows.
# `image_gen` is in the default disabled list because no image provider key
# (FAL_KEY / DEEPINFRA_API_KEY) is configured; re-enable per bot when one is.
#
# Apply / repair the whole fleet with:  python scripts/bootstrap_fleet.py
#                                      python scripts/bootstrap_fleet.py --with-board

orchestrator: hermes-orchestrator

env_keys:
  openrouter: OPENROUTER_API_KEY
  gemini: GOOGLE_API_KEY

tools:
  # Full local computer access, enabled on every bot (idempotent apply):
  base:
    - web            # web_search / web_extract
    - browser        # browser automation (navigate, click, type, screenshots)
    - terminal       # shell + processes (approvals.mode: off -> runs as the logged-in user)
    - file           # read_file, write_file, patch, search on the whole user filesystem
    - code_execution # sandboxed python with tool RPC
    - vision         # vision_analyze for images/screenshots (OPENROUTER_API_KEY)
    - tts            # Edge TTS (free, keyless)
    - skills         # skills_list / skill_view
    - todo           # in-memory task planning
    - memory         # persistent memory across sessions
    - session_search # recall past conversations
    - connections    # user connections surface
    - clarify        # clarifying questions
    - delegation     # spawn child subagents
    - cronjob        # scheduled tasks
    - computer_use   # cua-driver GUI automation (ACQUIRE: screen/mouse/keyboard as normal user)
  # Known-nonfunctional without a configured provider key; disabled to avoid tool errors:
  disable_default: [image_gen]

bots:
  - name: hermes-orchestrator
    display: "HERMES - Main Orchestrator"
    role: Orchestrator
    description: >-
      HERMES main orchestrator. Decomposes a goal into kanban cards, fans them
      out to specialist bots, links dependencies, tracks progress, and judges
      completion. Orchestrates only; it does not implement tasks itself.
    provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    fallback:
      - { provider: gemini, model: gemini-3.8-flash }
    tools:
      enable: [kanban]   # drives the board: kanban_create / kanban_link / kanban_list
      disable: []
    mcp_servers: {}

  - name: researcher
    display: "Researcher - Research & fact-checking"
    role: Research & fact-checking
    description: >-
      Research and fact-checking specialist. Gathers web sources, verifies
      claims, cross-checks facts, and returns cited findings and research
      briefs.
    provider: gemini
    model: gemini-3.8-flash
    fallback:
      - { provider: openrouter, model: thinkingmachines/inkling-small:free }
    tools:
      enable: []         # web, browser, vision come with the base
      disable: []
    mcp_servers: {}

  - name: analyst
    display: "Analyst - Data analysis & statistics"
    role: Data analysis & statistics
    description: >-
      Data analysis and statistics specialist. Computes metrics, trends, and
      tables; turns raw data, logs, and CSV files into quantitative findings.
    provider: gemini
    model: gemini-3.1-pro-preview
    fallback:
      - { provider: gemini, model: gemini-3.8-flash }
    tools:
      enable: []         # code_execution covers pandas / statistics scripts
      disable: []
    mcp_servers: {}

  - name: security
    display: "Security - Cybersecurity & auditing"
    role: Cybersecurity & auditing
    description: >-
      Cybersecurity and auditing specialist. Threat modeling, vulnerability
      analysis, secure design review, audit checklists, and defensive
      remediation guidance.
    provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    fallback:
      - { provider: gemini, model: gemini-3.8-flash }
    tools:
      enable: []         # terminal runs nmap-style reconnaissance locally
      disable: []
    mcp_servers:
      rea:
        command: C:/Program Files/nodejs/node.exe
        args: ["C:/Users/User/AppData/Roaming/npm/node_modules/rea-agents/scripts/rea.mjs", "mcp"]
        enabled: true    # REA: managed/native code analysis, runtime inspection, browser pages

  - name: architect
    display: "Architect - System design & planning"
    role: System design & planning
    description: >-
      System design and planning specialist. Produces architecture designs,
      module boundaries, API contracts, data models, and step-by-step
      implementation plans.
    provider: openrouter
    model: thinkingmachines/inkling:free
    fallback:
      - { provider: gemini, model: gemini-3.5-flash }
      - { provider: ollama-launch, model: qwen3:8b-lowmem }
    tools:
      enable: []
      disable: []
    mcp_servers: {}

  - name: developer
    display: "Developer - Coding & bug fixing"
    role: Coding & bug fixing
    description: >-
      Coding and bug-fixing specialist. Implements features, writes and
      refactors code, fixes bugs, and runs quick checks to keep the build
      clean.
    provider: openrouter
    model: poolside/laguna-s-2.1:free
    fallback:
      - { provider: gemini, model: gemini-3.8-flash }
      - { provider: ollama-launch, model: qwen3:4b-32k }
    tools:
      enable: []         # terminal + file + code_execution = build/test loop
      disable: []
    mcp_servers: {}

  - name: tester
    display: "Tester - Testing & QA"
    role: Testing & QA
    description: >-
      Testing and QA specialist. Writes and runs tests, reproduces bugs,
      verifies acceptance criteria, and reports failures with exact
      reproduction steps.
    provider: openrouter
    model: poolside/laguna-xs-2.1:free
    fallback:
      - { provider: gemini, model: gemini-3.8-flash }
      - { provider: ollama-launch, model: qwen3:4b-32k }
    tools:
      enable: []         # terminal + code_execution drive the test suites
      disable: []
    mcp_servers: {}

  - name: reviewer
    display: "Reviewer - Code review"
    role: Code review
    description: >-
      Code review specialist. Reviews diffs and PRs for correctness,
      regressions, style, and maintainability, and returns concrete
      actionable findings.
    provider: openrouter
    model: poolside/laguna-s-2.1:free
    fallback:
      - { provider: gemini, model: gemini-3.8-flash }
    tools:
      enable: []         # file + terminal (read/diff) + web for comparisons
      disable: []
    mcp_servers: {}

  - name: devops
    display: "DevOps - Deployment & infrastructure"
    role: Deployment & infrastructure
    description: >-
      Deployment and infrastructure specialist. CI/CD pipelines (GitHub
      Actions), build and release automation, environment setup, monitoring,
      and operational runbooks.
    provider: gemini
    model: gemini-3.5-flash
    fallback:
      - { provider: openrouter, model: poolside/laguna-xs-2.1:free }
      - { provider: ollama-launch, model: qwen3:4b-32k }
    tools:
      enable: []         # cronjob + terminal + gh/git for pipelines and releases
      disable: []
    mcp_servers: {}

  - name: reverse-engineer
    display: "Reverse Engineer - Binary analysis & debugging"
    role: Binary analysis & debugging
    description: >-
      Binary analysis and debugging specialist. Disassembly, protocol and
      file-format reconstruction, deobfuscation, and low-level debugging via
      REA tooling.
    provider: openrouter
    model: thinkingmachines/inkling:free
    fallback:
      - { provider: gemini, model: gemini-3.8-flash }
      - { provider: ollama-launch, model: qwen3:8b-lowmem }
    tools:
      enable: []         # terminal + file + vision for hex dumps, tracers, screenshots
      disable: []
    mcp_servers:
      rea:
        command: C:/Program Files/nodejs/node.exe
        args: ["C:/Users/User/AppData/Roaming/npm/node_modules/rea-agents/scripts/rea.mjs", "mcp"]
        enabled: true    # REA: binary analysis, binary debugging RE tool suite (229 tools)

  - name: writer
    display: "Writer - Documentation"
    role: Documentation
    description: >-
      Documentation specialist. Writes READMEs, guides, API docs, changelogs,
      and clear technical copy from engineering output.
    provider: gemini
    model: gemini-3.8-flash
    fallback:
      - { provider: gemini, model: gemini-3.5-flash }
      - { provider: openrouter, model: thinkingmachines/inkling-small:free }
    tools:
      enable: []         # web + browser verify rendered docs / translations
      disable: []
    mcp_servers: {}

  - name: designer
    display: "Designer - UI/UX & frontend design"
    role: UI/UX & frontend design
    description: >-
      UI/UX and frontend design specialist. Design systems, layouts, color
      and typography, mockups, and visual QA of screens.
    provider: gemini
    model: gemini-3.7-flash
    fallback:
      - { provider: gemini, model: gemini-3.8-flash }
    tools:
      enable: []         # browser screenshots + vision + computer_use drive visual QA
      disable: []
    mcp_servers: {}

  - name: automater
    display: "Automater - Scripts & integrations"
    role: Scripts & integrations
    description: >-
      Scripting and integration specialist. Automation scripts, API and
      webhook integrations, cron jobs, and glue code that makes workflows run
      hands-off.
    provider: openrouter
    model: poolside/laguna-xs-2.1:free
    fallback:
      - { provider: gemini, model: gemini-3.8-flash }
      - { provider: ollama-launch, model: qwen3:4b-32k }
    tools:
      enable: []         # cronjob + terminal + computer_use = full workflow automation
      disable: []
    mcp_servers: {}

board:
  # Board connected to this repository (set by --with-board).
  slug: default
  default_workdir: .          # resolved to this repo's absolute path at apply time
  orchestrator_profile: hermes-orchestrator
  auto_decompose: true
  decomposer:
    provider: openrouter
    model: thinkingmachines/inkling-small:free
